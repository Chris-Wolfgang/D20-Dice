name: AOT Smoke

# Native-AOT publish-and-run smoke consumer (#220, follow-up to #175).
#
# Publishes a tiny console consumer with PublishAot and runs the native binary,
# so the build fails if the library stops compiling or running under native AOT.
# This is the *runtime* half of the AOT verification; the *static* half is the
# IsAotCompatible analyzer gate on the library build (#175).
#
# windows-latest ships the MSVC "Desktop development with C++" workload that the
# native linker requires, so no extra toolchain install is needed.
#
# Second leg, "AOT smoke (linux-arm64)" on ubuntu-24.04-arm (fleet standard
# standards/test-matrix.md item 4, #450): the native binary is per-architecture, so the
# managed ARM64 stages in pr.yaml do not cover it. The arm64 runner is free on public
# repositories only; a private repository skips this leg by condition. It is its own job
# so it can become its own required check once it has passed on main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aot-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aot-smoke:
    name: "AOT publish + run"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Publish (native AOT, win-x64)
        # The AotSmoke csproj turns PublishAot on only while publishing (_IsPublishing),
        # so this is the one restore in CI that pulls the ILCompiler packs and a runtime
        # identifier into the graph; every other restore stays RID-agnostic.
        run: dotnet publish aot-smoke/Wolfgang.D20.Dice.AotSmoke/Wolfgang.D20.Dice.AotSmoke.csproj -c Release -r win-x64

      - name: Run native binary
        shell: bash
        run: |
          EXE="aot-smoke/Wolfgang.D20.Dice.AotSmoke/bin/Release/net10.0/win-x64/publish/Wolfgang.D20.Dice.AotSmoke.exe"
          echo "Running: $EXE"
          "$EXE"

  aot-smoke-linux-arm64:
    name: AOT smoke (linux-arm64)
    runs-on: ubuntu-24.04-arm
    if: ${{ !github.event.repository.private }}
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # Same step as repo-template's aot-smoke.yaml: the runner image normally ships clang and
      # zlib1g-dev, so apt runs only as a fallback, with retries, because a single
      # `apt-get update` fails the job whenever the runner cannot resolve the Ubuntu mirrors.
      - name: Install Native AOT prerequisites
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1 \
            && dpkg-query -W -f='${Status}' zlib1g-dev 2>/dev/null | grep -q 'install ok installed'; then
            echo "clang ($(clang --version | head -n 1)) and zlib1g-dev are on the runner image; apt not needed."
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y clang zlib1g-dev; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt of 3 failed; retrying in $((attempt * 30)) s."
            sleep $((attempt * 30))
          done
          echo "::error::clang and zlib1g-dev could not be installed after 3 apt attempts."
          exit 1

      - name: Publish (native AOT, linux-arm64)
        # PublishAot is on only while publishing (_IsPublishing); see the win-x64 leg.
        run: dotnet publish aot-smoke/Wolfgang.D20.Dice.AotSmoke/Wolfgang.D20.Dice.AotSmoke.csproj -c Release -r linux-arm64

      - name: Run native binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="aot-smoke/Wolfgang.D20.Dice.AotSmoke/bin/Release/net10.0/linux-arm64/publish/Wolfgang.D20.Dice.AotSmoke"
          echo "Running: $BIN"
          "$BIN" < /dev/null
